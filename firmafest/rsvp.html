<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som Tåget Firmafest</title>
    <link rel="stylesheet" href="./stylesheets/styles.css">
    <link rel="stylesheet" href="./stylesheets/rsvp.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Rammetto+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo">
                <span class="logo-text">SOM</span>
                <img src="images/logo.png" alt="Som Tåget logo" class="logo-image">
                <span class="logo-text">TÅGET</span>
            </div>
            <div class="form-container">
                <div class="form-header">Personalinformation</div>
                <form id="myForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSeOmPHHT4sqfWuqFR19bDURpA0roihGTfTV_90TI-b3Pm3ffA/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
                    <label for="name">Namn</label>
                    <div class="gradient-border"><input type="text" id="name" name="entry.1277874608" required></div><br>
                    <label for="email">Email</label>
                    <div class="gradient-border"><input type="email" id="email" name="entry.592047305" required></div><br>
                    <label for="allergies">Allergier</label>
                    <div class="gradient-border"><input type="text" id="allergies" name="entry.540381798"></div><br>
                    <label for="vacation">Semesteranspråk</label>
                    <div class="gradient-border"><input type="text" id="vacation" name="entry.776624664"></div>
                    <button type="submit" class="rsvp-button">Anmäl mig!</button>
                </form>
                <iframe name="hidden_iframe" style="display:none;"></iframe>
            </div>
        </div>
        <footer>
            <a href="index.html" class="nav-item" id="start">
                <span>START</span>
            </a>  
            <a href="speakers.html" class="nav-item" id="inspo">
                <span>INSPO</span>
            </a>
            <a href="information.html" class="nav-item" id="info">
                <span>INFO</span>
            </a>
            <a href="rsvp.html" class="nav-item" id="rsvp">
                <span>ANMÄLAN</span>
            </a>
        </footer>
    </div>
    <script>
        var submitted = false;
        document.getElementById("myForm").onsubmit = function () {
            submitted = true;
            setTimeout(function() {
                if (submitted) {
                    document.getElementById("myForm").reset();
                    window.location.href = "rsvp-success.html"; 
                }
            }, 1000);
        };
    </script>
</body>
</html>
