    <script>
    // Function to calculate "days ago"
    function calculateDaysAgo(referenceDate) {
      const now = new Date(); // Current date
      const reference = new Date(referenceDate); // The given reference date
      const diffTime = Math.abs(now - reference); // Difference in milliseconds
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); // Convert to days
      return diffDays;
    }

    // Function to update all elements with "data-reference-date"
    function updateDaysAgo() {
      // Select all elements with the `data-reference-date` attribute
      const elements = document.querySelectorAll('[data-reference-date]');
      elements.forEach(element => {
        const referenceDate = element.getAttribute('data-reference-date'); // Get the date from the attribute
        const daysAgo = calculateDaysAgo(referenceDate);
        element.textContent = `${daysAgo} days ago`; // Update the text content
      });
    }

    // Run the update function when the page loads
    window.onload = updateDaysAgo;
  </script>
