<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som Tåget Firmafest</title>
    <link rel="preload" href="images/1car.png" as="image">
    <link rel="preload" href="images/2cars.png" as="image">
    <link rel="preload" href="images/3cars.png" as="image">
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="../images/favicon.png">
    <link rel="stylesheet" href="./stylesheets/styles.css">
    <link rel="stylesheet" href="./stylesheets/inspiration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Rammetto+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo">
                <span class="logo-text">SOM</span>
                <img src="images/logo.png" alt="Som Tåget logo" class="logo-image">
                <span class="logo-text">TÅGET</span>
            </div>
            <div class="inspo-hero">
                <p>Här presenteras inom kort spännande föreläsare som kommer ta med dig på en oförglömlig resa.</p>
            </div>
            <button class="glowy-button" id="triggerButton">
                Ok, men inspirera mig!
            </button>
            <div class="image-column">
                <img src="images/1car.png" id="image1" class="image image1" alt="Image 1">
                <img src="images/2cars.png" id="image2" class="image image2" alt="Image 2">
                <img src="images/3cars.png" id="image3" class="image image3" alt="Image 3">
            </div>
        </div>
        <footer>
            <a href="index.html" class="nav-item" id="start">
                <span>START</span>
            </a>  
            <a href="inspiration.html" class="nav-item" id="inspo">
                <span>INSPO</span>
            </a>
            <a href="information.html" class="nav-item" id="info">
                <span>INFO</span>
            </a>
            <a href="rsvp.html" class="nav-item" id="rsvp">
                <span>ANMÄLAN</span>
            </a>
        </footer>
    </div>
    <script>
        document.getElementById('triggerButton').addEventListener('click', () => {
            const images = [
                document.getElementById('image1'),
                document.getElementById('image2'),
                document.getElementById('image3'),
                ];

            images.forEach((image, index) => {
                image.classList.remove('visible');
            })

            images.forEach((image, index) => {
                setTimeout(() => {
                    requestAnimationFrame(() => {
                        image.classList.add('visible');
                    });
                    if (index > 0) {
                        const previousImage = images[index - 1];

                        previousImage.classList.remove('visible');
                    }
                }, index * 1300);
            });
        });
    </script>
</body>
</html>
